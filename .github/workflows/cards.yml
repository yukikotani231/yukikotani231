name: Update profile cards

on:
  schedule:
    - cron: "17 15 * * *" # 00:17 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate cards
        env:
          # PAT so private contributions and languages are included
          GITHUB_TOKEN: ${{ secrets.SUMMARY_CARDS_TOKEN }}
        run: python3 scripts/generate_cards.py --user "${{ github.repository_owner }}" --out cards
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          git diff --cached --quiet || { git commit -m "Update profile cards" && git push; }
