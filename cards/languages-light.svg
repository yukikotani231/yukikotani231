<svg xmlns="http://www.w3.org/2000/svg" width="495" height="215" viewBox="0 0 495 215" role="img" aria-label="Most Used Languages">
<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',Helvetica,Arial,sans-serif; }
  .title { font-size: 16px; font-weight: 600; fill: #1f2328; }
  .label { font-size: 13px; fill: #656d76; }
  .value { font-size: 13px; font-weight: 600; fill: #1f2328; }
  .big { font-size: 28px; font-weight: 700; fill: #0969da; }
  .small { font-size: 11px; fill: #656d76; }
  .fade { opacity: 0; animation: fade .5s ease-out forwards; }
  @keyframes fade { to { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .fade { animation: none; opacity: 1; } }
</style>
<rect x="0.5" y="0.5" width="494" height="214" rx="6" fill="#ffffff" stroke="#d0d7de"/>
<text x="24" y="36" class="title">Most Used Languages</text>
<clipPath id="bar"><rect x="24" y="56" width="447" height="10" rx="5"/></clipPath><g clip-path="url(#bar)">
<rect x="24.00" y="56" width="186.10" height="10" fill="#dea584"/>
<rect x="209.60" y="56" width="103.68" height="10" fill="#555555"/>
<rect x="312.78" y="56" width="62.17" height="10" fill="#3572A5"/>
