<rect x="420.69" y="56" width="16.50" height="10" fill="#3178c6"/>
<rect x="436.69" y="56" width="11.64" height="10" fill="#00ADD8"/>
<rect x="447.83" y="56" width="7.70" height="10" fill="#427819"/>
<rect x="455.03" y="56" width="16.47" height="10" fill="#6e7681"/>
</g>
<g class="fade" style="animation-delay:0ms"><circle cx="29" cy="92" r="5" fill="#dea584"/><text x="42" y="96" class="value">Rust</text><text x="224" y="96" class="label" text-anchor="end">41.5%</text></g>
<g class="fade" style="animation-delay:60ms"><circle cx="259" cy="92" r="5" fill="#555555"/><text x="272" y="96" class="value">C</text><text x="454" y="96" class="label" text-anchor="end">23.1%</text></g>
